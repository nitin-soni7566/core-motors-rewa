<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__</title>
    <!-- Apply saved theme + language before first paint (no white flash in dark mode) -->
    <script>
      try {
        var t = localStorage.getItem('cm-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
        if (localStorage.getItem('cm-lang') === 'hi') document.documentElement.lang = 'hi'
      } catch (e) {}
    </script>
    <meta name="description" content="__DESCRIPTION__" data-rh="true" />
    <meta name="theme-color" content="__THEME__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />
    <meta property="og:title" content="__TITLE__" data-rh="true" />
    <meta property="og:description" content="__DESCRIPTION__" data-rh="true" />
    <meta property="og:url" content="__SITE_URL__" data-rh="true" />
    <meta property="og:image" content="__OG_IMAGE__" data-rh="true" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TITLE__" data-rh="true" />
    <meta name="twitter:description" content="__DESCRIPTION__" data-rh="true" />
    <meta name="twitter:image" content="__OG_IMAGE__" data-rh="true" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    />

    <!-- Structured data (generated from src/data/siteConfig.js at build time) -->
    <script type="application/ld+json">
__JSON_LD__
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to view the Core Motors Rewa website.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
